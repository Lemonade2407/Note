<text x="420.0" y="47.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="17" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">中断请求（外设、时钟、故障）</text>
<text x="400.0" y="128.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">中断隐指令（由硬件自动完成，不是程序指令）</text>
<text x="400.0" y="152.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">① 关中断　　② 保存断点（PC、PSW）</text>
<text x="400.0" y="176.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">③ 引出中断服务程序</text>
<text x="400.0" y="260.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">中断服务程序（软件完成）</text>
<text x="400.0" y="284.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">① 保存现场　　② 处理中断</text>
<text x="400.0" y="308.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">③ 恢复现场、开中断</text>
<text x="420.0" y="386.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="17" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">返回断点，继续执行原程序</text>
<text x="64.0" y="152.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">硬件</text>
<text x="64.0" y="284.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">软件</text>
