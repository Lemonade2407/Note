<text x="327.0" y="239.0" font-family="SimSun, 'Microsoft YaHei', serif" font-size="13" text-anchor="end" dominant-baseline="central" fill="#2b2b2b">A</text>
<text x="385.0" y="239.0" font-family="SimSun, 'Microsoft YaHei', serif" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">1</text>
