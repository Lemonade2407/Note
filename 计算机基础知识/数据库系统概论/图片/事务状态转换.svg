<text x="300.0" y="350.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">提交后数据永久保存；中止后回滚到事务开始前的状态</text>
