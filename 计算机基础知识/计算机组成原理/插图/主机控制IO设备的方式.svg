<text x="450.0" y="28.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">主机与 I/O 设备数据传送的四种控制方式</text>
<text x="128.0" y="86.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">程序查询方式</text>
<text x="44.0" y="126.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#555555">传送单位</text>
<text x="128.0" y="150.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">字（字节）</text>
<text x="44.0" y="184.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#555555">CPU 干预程度</text>
<text x="42.0" y="206.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">CPU 全程参与：先查询设备</text>
<text x="42.0" y="227.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">状态，就绪后传送一个字</text>
<text x="42.0" y="248.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">（或字节），再继续查询。</text>
<text x="128.0" y="289.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">干预最多</text>
<text x="76.0" y="331.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">CPU</text>
<text x="182.0" y="331.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">I/O</text>
<text x="342.0" y="86.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">程序中断方式</text>
<text x="258.0" y="126.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#555555">传送单位</text>
<text x="342.0" y="150.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">字（字节）</text>
<text x="258.0" y="184.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#555555">CPU 干预程度</text>
<text x="256.0" y="206.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">CPU 每传送一个字，就被</text>
<text x="256.0" y="227.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">中断一次，转入中断服务</text>
<text x="256.0" y="248.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">程序完成一次传送。</text>
<text x="342.0" y="289.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">干预较多</text>
<text x="290.0" y="331.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">CPU</text>
<text x="396.0" y="331.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">I/O</text>
<text x="556.0" y="86.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">DMA 方式</text>
<text x="472.0" y="126.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#555555">传送单位</text>
<text x="556.0" y="150.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">数据块</text>
<text x="472.0" y="184.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#555555">CPU 干预程度</text>
<text x="470.0" y="206.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">传送前由 CPU 初始化</text>
<text x="470.0" y="227.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">DMA 控制器，传送过程</text>
<text x="470.0" y="248.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">由 DMA 接口接管。</text>
<text x="556.0" y="289.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">干预较少</text>
<text x="504.0" y="331.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">CPU</text>
<text x="610.0" y="331.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">I/O</text>
<text x="770.0" y="86.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">通道方式</text>
<text x="686.0" y="126.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#555555">传送单位</text>
<text x="770.0" y="150.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">一组数据块</text>
<text x="686.0" y="184.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#555555">CPU 干预程度</text>
<text x="684.0" y="206.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">CPU 只启动通道并执行</text>
<text x="684.0" y="227.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">通道程序，一批数据块</text>
<text x="684.0" y="248.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">传完后才向 CPU 报告。</text>
<text x="770.0" y="289.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">干预最少</text>
<text x="718.0" y="331.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">CPU</text>
<text x="824.0" y="331.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">I/O</text>
<text x="450.0" y="390.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#555555">注：箭头粗细示意 CPU 对传送过程的干预程度，越粗表示干预越多。</text>
<text x="450.0" y="410.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">图 10.20  主机控制 I/O 设备的四种方式</text>
