<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker></defs>
<rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
<g stroke="#2b2b2b" fill="none" stroke-linecap="round" stroke-linejoin="round">
<line x1="80.0" y1="60.0" x2="80.0" y2="330.0" stroke-width="0"/>
<line x1="80.0" y1="100.0" x2="860.0" y2="100.0" stroke-width="1.0" stroke-dasharray="5,4"/>
<line x1="80.0" y1="250.0" x2="860.0" y2="250.0" stroke-width="1.0" stroke-dasharray="5,4"/>
<line x1="140.0" y1="100.0" x2="470.0" y2="168.0" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="360.0" y1="250.0" x2="470.0" y2="168.0" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="470.0" y1="168.0" x2="470.0" y2="250.0" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="470.0" y1="168.0" x2="470.0" y2="100.0" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="140.0" y1="350.0" x2="470.0" y2="350.0" stroke-width="1.2"/>
<line x1="140.0" y1="350.0" x2="140.0" y2="340.0" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="470.0" y1="350.0" x2="470.0" y2="340.0" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="560.0" y="300.0" width="300.0" height="96.0" stroke-width="1.3" fill="#fdf6cf" rx="6"/>
</g>
<text x="30.0" y="28.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="17" text-anchor="start" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">CSMA/CD：争用期 2τ 内可能发生冲突，故帧长不能太短</text>
<text x="60.0" y="100.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="end" dominant-baseline="central" fill="#2b2b2b">A</text>
<text x="60.0" y="250.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="end" dominant-baseline="central" fill="#2b2b2b">B</text>
<text x="200.0" y="82.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">t=0 时 A 开始发送</text>
<text x="300.0" y="292.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">A 的信号尚未到达 B 时
B 也发送（冲突）</text>
<text x="492.0" y="214.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" fill="#c00000">冲突发生</text>
<text x="305.0" y="368.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">争用期 2τ（以太网取 51.2 μs，即 512 bit 时间）</text>
<text x="710.0" y="328.5" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">最小帧长 = 2τ × 数据率</text>
<text x="710.0" y="348.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">= 51.2 μs × 10 Mb/s = 512 bit = 64 B</text>
<text x="710.0" y="367.5" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">帧太短则可能在冲突信号返回前就发完</text>
<text x="660.0" y="60.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">时间 →</text>
</svg>
