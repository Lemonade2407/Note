</g>
<text x="30.0" y="28.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="17" text-anchor="start" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">域名解析：主机→本地域名服务器用递归查询，本地→其他服务器用迭代查询</text>
<text x="109.0" y="222.2" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">主机</text>
<text x="109.0" y="241.8" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">（客户端）</text>
<text x="312.0" y="222.9" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">本地域名服务器</text>
<text x="312.0" y="241.1" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">（默认 DNS）</text>
<text x="700.0" y="100.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">根域名服务器</text>
<text x="700.0" y="202.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">com 顶级域名服务器</text>
<text x="700.0" y="304.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">example.com 权限服务器</text>
<text x="199.0" y="204.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">1</text>
<text x="199.0" y="262.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">8</text>
<text x="50.0" y="196.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">递归查询</text>
<text x="492.0" y="146.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">2</text>
<text x="534.0" y="186.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">3</text>
<text x="498.0" y="196.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">4</text>
<text x="520.0" y="226.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">5</text>
<text x="498.0" y="282.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">6</text>
<text x="534.0" y="316.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">7</text>
<text x="460.0" y="130.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">迭代查询</text>
<text x="40.0" y="356.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">① 主机问本地 DNS；② 本地问根；③ 根只返回 com 服务器地址；④ 本地问 com；</text>
<text x="40.0" y="382.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">⑤ com 返回 example.com 权限服务器地址；⑥ 本地问权限服务器；⑦ 得到 IP；⑧ 缓存后返回给主机。</text>
<text x="40.0" y="414.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">DNS 通常使用 UDP 53 端口（区域传送用 TCP）；各级服务器与主机的缓存按 TTL 过期。</text>
</svg>
