<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker></defs>
<rect x="0" y="0" width="880" height="420" fill="#ffffff"/>
<g stroke="#2b2b2b" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="60.0" y="150.0" width="120.0" height="50.0" stroke-width="1.4" fill="#dce6f3" rx="6"/>
<rect x="620.0" y="150.0" width="150.0" height="50.0" stroke-width="1.4" fill="#d9e3cc" rx="6"/>
<rect x="330.0" y="60.0" width="140.0" height="44.0" stroke-width="1.4" fill="#fdf6cf" rx="6"/>
<line x1="120.0" y1="150.0" x2="330.0" y2="96.0" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="400.0" y1="104.0" x2="120.0" y2="168.0" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<line x1="180.0" y1="150.0" x2="620.0" y2="150.0" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="180.0" y1="176.0" x2="620.0" y2="176.0" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="620.0" y1="222.0" x2="180.0" y2="222.0" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="180.0" y1="262.0" x2="620.0" y2="262.0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<line x1="620.0" y1="302.0" x2="180.0" y2="302.0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ah)"/>
</g>
<text x="30.0" y="28.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="17" text-anchor="start" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">浏览器访问一个网页的完整过程</text>
<text x="120.0" y="175.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">浏览器</text>
<text x="695.0" y="175.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">Web 服务器</text>
<text x="400.0" y="82.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">DNS 服务器</text>
<text x="150.0" y="100.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">① DNS 解析域名 → IP</text>
<text x="300.0" y="134.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">② TCP 三次握手建立连接（80 端口）</text>
<text x="300.0" y="196.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">③ 发送 HTTP 请求报文（GET /index.html）</text>
<text x="300.0" y="242.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">④ 返回 HTTP 响应（200 OK + HTML）</text>
<text x="300.0" y="282.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">⑤ 浏览器解析 HTML，再请求图片/CSS/JS（复用连接）</text>
<text x="300.0" y="322.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">⑥ 渲染页面，按需四次挥手释放连接</text>
<text x="60.0" y="380.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">HTTP 本身无状态，用 Cookie/Session 保持会话；持久连接可复用同一条 TCP 连接传输多个对象。</text>
</svg>
