<line x1="680.0" y1="150.0" x2="250.0" y2="176.0" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="250.0" y1="200.0" x2="680.0" y2="226.0" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="60.0" y1="262.0" x2="840.0" y2="262.0" stroke-width="0.9" stroke-dasharray="4,4"/>
<line x1="250.0" y1="290.0" x2="680.0" y2="306.0" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="680.0" y1="306.0" x2="250.0" y2="322.0" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="60.0" y1="352.0" x2="840.0" y2="352.0" stroke-width="0.9" stroke-dasharray="4,4"/>
<line x1="250.0" y1="380.0" x2="680.0" y2="406.0" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="680.0" y1="420.0" x2="250.0" y2="446.0" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="680.0" y1="460.0" x2="250.0" y2="486.0" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="250.0" y1="500.0" x2="680.0" y2="526.0" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="158.0" y="514.0" width="84.0" height="32.0" stroke-width="1.3" fill="#fdf6cf" rx="4"/>
</g>
<text x="30.0" y="28.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="17" text-anchor="start" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">TCP 三次握手与四次挥手（含 TIME-WAIT 等待 2MSL）</text>
<text x="250.0" y="54.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">客户</text>
<text x="680.0" y="54.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">服务器</text>
<text x="40.0" y="100.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">三次握手</text>
<text x="262.0" y="88.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">SYN=1, seq=x</text>
<text x="668.0" y="138.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="end" dominant-baseline="central" fill="#2b2b2b">SYN=1, ACK=1, seq=y, ack=x+1</text>
<text x="262.0" y="188.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">ACK=1, seq=x+1, ack=y+1</text>
<text x="238.0" y="118.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="end" dominant-baseline="central" fill="#2b2b2b">SYN-SENT</text>
<text x="238.0" y="230.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="end" dominant-baseline="central" fill="#2b2b2b">ESTABLISHED</text>
<text x="692.0" y="170.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">SYN-RCVD</text>
<text x="692.0" y="232.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">ESTABLISHED</text>
<text x="40.0" y="286.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">数据传送</text>
<text x="465.0" y="340.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">全双工数据传输（滑动窗口 + 累计确认）</text>
<text x="40.0" y="376.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">四次挥手</text>
<text x="262.0" y="368.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">FIN=1, seq=u</text>
<text x="668.0" y="408.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="end" dominant-baseline="central" fill="#2b2b2b">ACK=1, ack=u+1</text>
<text x="668.0" y="448.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="end" dominant-baseline="central" fill="#2b2b2b">FIN=1, ACK=1, seq=w, ack=u+1</text>
<text x="262.0" y="488.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">ACK=1, ack=w+1</text>
<text x="238.0" y="398.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="end" dominant-baseline="central" fill="#2b2b2b">FIN-WAIT-1</text>
<text x="238.0" y="440.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="end" dominant-baseline="central" fill="#2b2b2b">FIN-WAIT-2</text>
<text x="238.0" y="506.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="end" dominant-baseline="central" fill="#2b2b2b">TIME-WAIT</text>
<text x="692.0" y="440.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">CLOSE-WAIT</text>
<text x="692.0" y="480.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="11" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">LAST-ACK</text>
<text x="200.0" y="530.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">2MSL</text>
<text x="60.0" y="576.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">TIME-WAIT 等待 2MSL：保证最后的 ACK 能到达，并让旧连接的报文在网络中消失</text>
</svg>
