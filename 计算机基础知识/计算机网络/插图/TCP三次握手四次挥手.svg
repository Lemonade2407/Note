<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker></defs>
<rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
<g stroke="#2b2b2b" fill="none" stroke-linecap="round" stroke-linejoin="round">
<line x1="250.0" y1="70.0" x2="250.0" y2="560.0" stroke-width="1.3" stroke-dasharray="6,4"/>
<line x1="680.0" y1="70.0" x2="680.0" y2="560.0" stroke-width="1.3" stroke-dasharray="6,4"/>
