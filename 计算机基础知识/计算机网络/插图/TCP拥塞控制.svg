<text x="100.0" y="426.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">① 慢开始（指数增长）→ ② 到 ssthresh 转拥塞避免（线性增长）→ ③ 超时：ssthresh 减半、cwnd=1</text>
<text x="474.8" y="374.4" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" fill="#c00000">超时</text>
<text x="110.0" y="448.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">若收到三个重复 ACK（快重传），则执行快恢复：ssthresh = cwnd/2，cwnd = ssthresh 后直接进入拥塞避免</text>
