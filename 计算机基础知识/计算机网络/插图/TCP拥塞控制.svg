<text x="30.0" y="28.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="17" text-anchor="start" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">TCP 拥塞窗口变化：慢开始（指数）→ 拥塞避免（线性）→ 超时后 ssthresh 减半、cwnd 归 1</text>
