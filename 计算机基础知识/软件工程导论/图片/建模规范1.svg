<text x="165.0" y="62.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">或</text>
<text x="336.0" y="54.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="30" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">椭圆形或圆角矩形表示数据加工，其中要注明加工的名字，需要使用</text>
<text x="336.0" y="104.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="30" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">动词性短语。</text>
<text x="165.0" y="172.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">或</text>
<text x="336.0" y="170.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="30" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">长方形或长方体表示外部实体，其中要注明数据源或数据汇点的名字。</text>
<text x="165.0" y="274.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">或</text>
<text x="336.0" y="251.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="30" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">双横线或右开口长方形表示数据存储，要用名词或名词性短语为其</text>
<text x="336.0" y="301.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="30" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">命名。</text>
<text x="336.0" y="350.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="30" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">箭头表示数据流，即被加工数据的传递方向，要用名词或名词性短语</text>
<text x="336.0" y="400.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="30" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">为其命名。</text>
