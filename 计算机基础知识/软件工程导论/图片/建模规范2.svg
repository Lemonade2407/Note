<text x="68.0" y="270.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="26" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">A</text>
<text x="258.0" y="302.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="34" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">*</text>
<text x="316.0" y="240.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="26" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">B</text>
