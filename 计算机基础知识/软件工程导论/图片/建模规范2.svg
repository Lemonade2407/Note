<text x="961.0" y="90.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="26" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">数据A变换成数据B或数据C</text>
<text x="961.0" y="124.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="26" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">或数据B和数据C，其中“+”</text>
