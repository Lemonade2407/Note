<text x="357.0" y="459.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="26" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">A、数据B同时输入变</text>
<text x="357.0" y="493.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="26" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">换成数据C，其中，</text>
<text x="357.0" y="526.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="26" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">“+”号可以省略</text>
<text x="660.0" y="440.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="26" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">A</text>
<text x="852.0" y="457.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="32" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">⊕</text>
