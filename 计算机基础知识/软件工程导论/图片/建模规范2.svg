<text x="66.0" y="548.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="26" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">B</text>
<text x="147.0" y="456.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b">+</text>
