<text x="656.0" y="142.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">B</text>
<text x="180.0" y="193.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">是</text>
<text x="507.0" y="193.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">缺陷状态</text>
<text x="656.0" y="193.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">New</text>
<text x="180.0" y="244.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">Win7</text>
<text x="507.0" y="244.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">浏览器</text>
<text x="656.0" y="244.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">百度浏览器</text>
<text x="180.0" y="305.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">系统规定注册用户名的长度为 6-20 字符。用少于 6 个字符的用户名可以成功</text>
<text x="180.0" y="340.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">注册</text>
<text x="180.0" y="395.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">1.  进入贴吧网站首页</text>
<text x="180.0" y="445.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">2.  点击注册，进入用户注册页面</text>
<text x="180.0" y="495.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">3.  单击“同意”按钮，进入用户注册页面</text>
<text x="180.0" y="545.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">4.  在用户名文本框中输入“123”</text>
<text x="180.0" y="595.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">5.  设置密码为“johnson”</text>
<text x="180.0" y="645.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">6.  注册完毕后返回登录页面</text>
<text x="180.0" y="695.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">7.  输入用户名“123”，密码“johnson”</text>
<text x="180.0" y="744.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">注册成功，登陆成功</text>
<text x="180.0" y="795.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">提示用户名错误，不能注册成功</text>
<text x="180.0" y="848.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">建议修改</text>
