<text x="635.0" y="28.5" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="22" text-anchor="middle" dominant-baseline="central" fill="#C55A11" font-weight="bold">开源范式</text>
<text x="949.0" y="28.5" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="22" text-anchor="middle" dominant-baseline="central" fill="#C55A11" font-weight="bold">群智范式</text>
<text x="337.0" y="76.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">自上而下，逐步求精</text>
<text x="635.0" y="76.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">自下而上，关联演化</text>
<text x="949.0" y="76.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">宏观演化，局部求精</text>
<text x="128.0" y="160.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">需求</text>
<text x="128.0" y="249.5" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">质量</text>
<text x="128.0" y="327.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">效率</text>
<text x="128.0" y="423.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">过程模型</text>
<text x="128.0" y="496.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">支持工具</text>
<text x="128.0" y="554.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">计算环境</text>
<text x="41.0" y="224.5" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">理</text>
<text x="41.0" y="250.5" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">念</text>
<text x="41.0" y="468.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">方</text>
<text x="41.0" y="494.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="21" text-anchor="middle" dominant-baseline="central" fill="#2b2b2b" font-weight="bold">法</text>
<text x="196.0" y="147.8" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">有明确用户和明确一致的用户需</text>
<text x="196.0" y="172.2" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">求描述，这是软件开发的前提</text>
<text x="502.0" y="147.8" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">没有明确的用户，开发者基于</text>
<text x="502.0" y="172.2" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">自己的构思创作软件源代码</text>
<text x="792.0" y="135.7" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">有潜在用户群体，基于原型</text>
<text x="792.0" y="160.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">体验发现用户，引导用户</text>
<text x="792.0" y="184.3" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">体验，并不断产生需求</text>
<text x="196.0" y="249.5" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">源代码满足需求规格的程度</text>
<text x="502.0" y="249.5" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">开发社区的规模和口碑</text>
<text x="792.0" y="249.5" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">软件社区关注度和口碑</text>
<text x="196.0" y="327.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">开发满足需求软件的时间和成本</text>
<text x="502.0" y="327.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">响应开发社区问题的时间</text>
<text x="792.0" y="314.9" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">“激发更多参与者作出贡献，以</text>
<text x="792.0" y="339.2" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">及汇聚广大贡献者才智” 的效率</text>
<text x="196.0" y="410.9" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">瀑布模型、敏捷模型、</text>
<text x="196.0" y="435.2" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">能力成熟度模型</text>
<text x="502.0" y="423.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">开发者社区的自组织模式</text>
<text x="792.0" y="423.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">激发与汇聚模型</text>
<text x="196.0" y="496.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">软件产品线工具集</text>
<text x="502.0" y="496.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">版本控制工具、缺陷追踪工具</text>
<text x="792.0" y="496.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">激发与汇聚工具集</text>
<text x="196.0" y="554.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">面向计算机环境</text>
<text x="502.0" y="554.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">面向互联网环境</text>
<text x="792.0" y="554.0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" fill="#2b2b2b">面向人机物融合环境</text>
